name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Gustavo007-del
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=22D3EE&color_dots=2d3343,10B981,0891B2,22D3EE,A78BFA
            dist/snake-light.svg?palette=github-light&color_snake=0891B2&color_dots=eef0f6,10B981,22D3EE,0891B2,7C3AED

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}